<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог аниме — ANIVIBES</title>
    <meta name="description"
    content="Каталог аниме для тех, кому сложно определиться."/>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/footer.css">
  <script src="js/anime-data.js" defer></script>
  <script src="js/filters.js" defer></script>
  <script src="js/script.js" defer></script>
  <script src="js/catalog.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>

  <header class="site-header container glass">
    <div class="header-search-placeholder" aria-hidden="true"></div>

    <a class="brand" href="index.html" aria-label="ANIVIBES — главная">
      <img src="assets/images/logo.svg" alt="ANIVIBES" width="2012" height="475">
    </a>

    <nav class="site-nav" aria-label="Основная навигация">
      <a href="index.html">Подбор</a>
      <a href="catalog.html" aria-current="page">Каталог</a>
    </nav>
  </header>

  <main id="main-content" class="container inner-page">
    <h1 class="page-title">Каталог аниме</h1>

    <!-- Сетка фильтров -->
    <section id="catalog-filters" class="filter-panel glass" aria-label="Фильтры каталога">
      <div class="selection-tools">
        <button id="reset-catalog" class="text-button" type="button">Сбросить фильтры</button>
      </div>
    </section>

    <p id="catalog-count" class="catalog-count"></p>
    <section id="catalog-grid" class="catalog-grid" aria-label="Каталог аниме"></section>
    <p id="catalog-empty" class="catalog-empty glass" hidden>По выбранным условиям ничего не найдено.</p>
  </main>

  <footer class="site-footer container glass">
    <div class="footer-grid">
      <div class="footer-brand">
        <div class="footer-dice" aria-hidden="true">
          <img class="footer-die-front" src="assets/images/footer-die-front.png" alt="" width="1254" height="1254">
        </div>
        <a class="footer-logo" href="index.html" aria-label="ANIVIBES — на главную">
          <img src="assets/images/logo.svg" alt="ANIVIBES" width="2012" height="475">
        </a>
      </div>

      <p class="footer-tagline">Твоё аниме на вечер</p>

      <nav class="footer-links" aria-label="Ссылки в подвале">
        <a href="https://github.com/valsnake/anivibes" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/github.svg" alt="" width="20" height="20">GitHub
        </a>
        <a href="https://t.me/valsnakee" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/telegram.svg" alt="" width="20" height="20">Telegram
        </a>
        <details class="footer-about">
          <summary>О проекте</summary>
          <p>ANIVIBES помогает выбрать аниме на вечер: настройте фильтры или доверьтесь случайному подбору.</p>
        </details>
      </nav>
    </div>

    <div class="footer-bottom">
      <p>© <span id="current-year">2026</span> ANIVIBES</p>
      <p>Автор проекта · VAL POLOZ</p>
    </div>
  </footer>
</body>
</html>
