<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог аниме — ANIVIBES</title>
    <meta name="description"
    content="Каталог аниме для тех, кому сложно определиться."/>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/anime-data.js" defer></script>
  <script src="js/script.js" defer></script>
  <script src="js/catalog.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>

  <header class="site-header container glass">
    <a class="brand" href="index.html" aria-label="ANIVIBES — главная">
      <img src="assets/images/logo.svg" alt="ANIVIBES" width="2012" height="475">
    </a>

    <!-- Форма поиска с подсказками -->
    <div class="header-search-placeholder" aria-hidden="true"></div>

    <nav class="site-nav" aria-label="Основная навигация">
      <a href="index.html">Подбор</a>
      <a href="catalog.html" aria-current="page">Каталог</a>
    </nav>
  </header>

  <main id="main-content" class="container inner-page">
    <h1 class="page-title">Каталог аниме</h1>

    <!-- Сетка фильтров -->
    <section id="catalog-filters" class="filter-panel glass" aria-label="Фильтры каталога">
      <label class="filter"><span>Жанры</span><select name="genre"><option value="">Любой жанр</option></select></label>
      <label class="filter"><span>Тип</span><select name="type"><option value="">Любой тип</option></select></label>
      <label class="filter"><span>Настроение</span><select name="mood"><option value="">Любое</option></select></label>
      <label class="filter"><span>Длительность</span><select name="duration"><option value="">Любая</option></select></label>
      <details class="advanced-filters glass">
        <summary>
          <img class="disclosure-chevron" src="assets/icons/chevron-down.svg" alt="" width="21" height="21">
          <span>Дополнительные фильтры</span>
          <span class="disclosure-action"><span class="when-closed">Открыть</span><span class="when-open">Свернуть</span></span>
        </summary>
        <div class="advanced-filters__grid">
          <label class="filter"><span>Тематика</span><select name="theme"><option value="">Любая тематика</option></select></label>
          <label class="filter"><span>Производство</span><select name="production"><option value="">Любое производство</option></select></label>
          <label class="filter"><span>Год выхода</span><select name="era"><option value="">Любой период</option></select></label>
          <label class="filter"><span>Форматы в истории</span><select name="composition"><option value="">Все форматы</option></select></label>
          <label class="filter"><span>Статус</span><select name="partState"><option value="">Любой статус</option></select></label>
        </div>
      </details>
      <div class="selection-tools">
        <button id="reset-catalog" class="text-button" type="button">Сбросить фильтры</button>
      </div>
    </section>

    <p id="catalog-count" class="catalog-count"></p>
    <section id="catalog-grid" class="catalog-grid" aria-label="Каталог аниме"></section>
    <p id="catalog-empty" class="catalog-empty glass" hidden>По выбранным условиям ничего не найдено.</p>
  </main>

  <footer class="site-footer container">
    <p>ANIVIBES · <span id="current-year">2026</span></p>
    <p>Автор проекта · VAL POLOZ</p>
  </footer>
</body>
</html>
